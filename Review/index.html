<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Algorithm Visualizer</h1>
            <div class="controls">
                <select id="algorithmType">
                    <option value="sorting">Sorting Algorithms</option>
                    <option value="searching">Searching Algorithms</option>
                </select>
                <select id="algorithm">
                    <!-- Options will be populated by JS -->
                </select>
                <button id="generateArray">Generate Random Array</button>
                <input type="text" id="arrayInput" placeholder="Enter array (comma-separated)">
                <input type="number" id="searchTarget" placeholder="Search target" style="display: none;">
                <button id="startBtn">Start</button>
                <button id="stepBtn">Step</button>
                <button id="resetBtn">Reset</button>
            </div>
        </header>
        <main>
            <div class="visualization">
                <canvas id="canvas"></canvas>
            </div>
            <div class="info">
                <div class="explanation">
                    <h3>Current Step:</h3>
                    <p id="stepExplanation">Select an algorithm and start visualization.</p>
                </div>
                <div class="stats">
                    <h3>Statistics:</h3>
                    <p id="stats">Comparisons: 0 | Swaps: 0 | Time: 0ms</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
</html>
